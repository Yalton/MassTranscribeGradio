name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install requests numpy
      - name: Unit tests
        run: |
          mkdir -p logs
          python -m unittest discover -s tests -v
